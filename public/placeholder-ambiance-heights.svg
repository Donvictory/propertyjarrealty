<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111317"/>
      <stop offset="50%" stop-color="#191c22"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800020"/>
      <stop offset="50%" stop-color="#e0a944"/>
      <stop offset="100%" stop-color="#800020"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad2)"/>
  <rect width="800" height="1000" fill="url(#grid2)"/>

  <!-- Subtle glow -->
  <circle cx="400" cy="450" r="280" fill="#e0a944" fill-opacity="0.08" filter="blur(60px)"/>

  <!-- Outer frame border -->
  <rect x="30" y="30" width="740" height="940" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <rect x="44" y="44" width="712" height="912" rx="16" fill="none" stroke="#e0a944" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Brand header pill -->
  <g transform="translate(400, 140)">
    <rect x="-130" y="-18" width="260" height="36" rx="18" fill="#800020" fill-opacity="0.25" stroke="#800020" stroke-width="1"/>
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#e5c378">PROPERTYJAR REALTY</text>
  </g>

  <!-- High-Rise Maisonette Architectural Graphic -->
  <g transform="translate(400, 380)">
    <!-- Tower / Maisonette silhouette -->
    <rect x="-80" y="-120" width="160" height="210" rx="6" fill="none" stroke="#e0a944" stroke-width="3" stroke-opacity="0.85"/>
    <rect x="-50" y="-90" width="100" height="180" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25"/>
    
    <!-- Floor dividers -->
    <line x1="-80" y1="-70" x2="80" y2="-70" stroke="#e0a944" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-80" y1="-20" x2="80" y2="-20" stroke="#e0a944" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-80" y1="30" x2="80" y2="30" stroke="#e0a944" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Windows / Balconies -->
    <rect x="-65" y="-105" width="25" height="25" rx="3" fill="#800020" fill-opacity="0.4"/>
    <rect x="40" y="-105" width="25" height="25" rx="3" fill="#800020" fill-opacity="0.4"/>
    <rect x="-65" y="-55" width="25" height="25" rx="3" fill="#800020" fill-opacity="0.4"/>
    <rect x="40" y="-55" width="25" height="25" rx="3" fill="#800020" fill-opacity="0.4"/>
    <rect x="-65" y="-5" width="25" height="25" rx="3" fill="#800020" fill-opacity="0.4"/>
    <rect x="40" y="-5" width="25" height="25" rx="3" fill="#800020" fill-opacity="0.4"/>

    <!-- Key icon for Handover -->
    <circle cx="0" cy="5" r="16" fill="#191c22" stroke="#e0a944" stroke-width="2"/>
    <path d="M 0 10 L 0 24 M -4 20 L 4 20 M -4 16 L 4 16" stroke="#e0a944" stroke-width="2" stroke-linecap="round"/>

    <!-- Base foundation -->
    <line x1="-120" y1="90" x2="120" y2="90" stroke="#e0a944" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title & Details -->
  <text x="400" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="2">AMBIANCE HEIGHTS</text>
  
  <rect x="340" y="605" width="120" height="3" rx="1.5" fill="url(#brandGrad)"/>

  <text x="400" y="650" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#e0a944" letter-spacing="2">LEKKI PHASE 1, LAGOS</text>
  
  <text x="400" y="685" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#a0a0ab" letter-spacing="0.5">Off Freedom Way • 2 &amp; 3 Bedroom Luxury Maisonettes</text>

  <!-- Handover status pill -->
  <g transform="translate(400, 770)">
    <rect x="-145" y="-22" width="290" height="44" rx="22" fill="#800020" fill-opacity="0.3" stroke="#e0a944" stroke-opacity="0.5" stroke-width="1"/>
    <text text-anchor="middle" x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1.5">🔑 ALMOST READY FOR HANDOVER</text>
  </g>

  <!-- Footer note -->
  <text x="400" y="870" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#71717a" letter-spacing="1.5">OFFICIAL PREVIEW • GOVERNOR’S CONSENT</text>
</svg>